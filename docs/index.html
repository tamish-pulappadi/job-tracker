<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Wire — new grad &amp; intern PM roles</title>
<style>
  :root {
    --paper: #f6f1e7;
    --paper-2: #efe8d9;
    --ink: #1d1a14;
    --ink-soft: #5c554a;
    --rule: #d8cfbc;
    --wire-red: #b3261e;
    --wire-red-soft: #b3261e22;
    --badge-intern: #1c5c46;
    --badge-intern-bg: #1c5c4618;
    --badge-grad: #1e3f8f;
    --badge-grad-bg: #1e3f8f16;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #16140f;
      --paper-2: #1e1b14;
      --ink: #ece5d5;
      --ink-soft: #a39a88;
      --rule: #35301f;
      --wire-red: #ff6b5e;
      --wire-red-soft: #ff6b5e26;
      --badge-intern: #6fd0ac;
      --badge-intern-bg: #6fd0ac1c;
      --badge-grad: #8fb0ff;
      --badge-grad-bg: #8fb0ff1a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    background-image: radial-gradient(circle at 15% 8%, var(--paper-2), transparent 55%);
    color: var(--ink);
    font: 16px/1.5 Charter, Georgia, "Times New Roman", serif;
    padding: 0 1.25rem 5rem;
  }
  .sheet { max-width: 62rem; margin: 0 auto; }

  header { padding: 2.5rem 0 1rem; border-bottom: 3px double var(--ink); }
  .masthead {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem 1.25rem;
  }
  h1 {
    margin: 0;
    font-size: clamp(2.1rem, 6vw, 3.4rem);
    font-weight: 800;
    letter-spacing: -.02em;
    text-transform: uppercase;
  }
  h1 .dot { color: var(--wire-red); }
  .tagline {
    font: 600 .72rem/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    text-transform: uppercase;
    letter-spacing: .14em;
    color: var(--ink-soft);
  }
  .meta {
    display: flex; flex-wrap: wrap; gap: .35rem 1.5rem;
    margin-top: .8rem;
    font: .78rem/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--ink-soft);
  }
  .meta b { color: var(--ink); font-weight: 700; }
  .meta .warn { color: var(--wire-red); }

  .controls {
    position: sticky; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; gap: .6rem; align-items: center;
    padding: .8rem 0;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
  }
  .chip {
    font: 600 .72rem/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    text-transform: uppercase; letter-spacing: .1em;
    border: 1px solid var(--ink-soft);
    background: none; color: var(--ink-soft);
    border-radius: 999px;
    padding: .45rem .85rem;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    background: var(--ink); border-color: var(--ink); color: var(--paper);
  }
  #q {
    flex: 1; min-width: 11rem;
    font: .85rem/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--ink);
    background: none;
    border: none; border-bottom: 1px solid var(--ink-soft);
    padding: .5rem .1rem;
    outline: none;
  }
  #q::placeholder { color: var(--ink-soft); }
  #q:focus { border-bottom-color: var(--wire-red); }

  ol { list-style: none; margin: 0; padding: 0; }
  .row {
    display: grid;
    grid-template-columns: 5.2rem 1fr auto;
    gap: .25rem 1.1rem;
    align-items: baseline;
    padding: .85rem .35rem;
    border-bottom: 1px solid var(--rule);
    text-decoration: none;
    color: inherit;
    animation: settle .35s ease both;
  }
  @keyframes settle { from { opacity: 0; transform: translateY(4px); } }
  .row:hover { background: var(--paper-2); }
  .when {
    grid-row: span 2;
    font: .72rem/1.7 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .fresh .when { color: var(--wire-red); font-weight: 700; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .6rem; }
  .co { font-weight: 800; font-size: 1.02rem; letter-spacing: -.01em; }
  .title { font-style: italic; }
  .row:hover .title { text-decoration: underline; text-underline-offset: 3px; }
  .sub {
    grid-column: 2;
    font: .74rem/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--ink-soft);
    overflow-wrap: anywhere;
  }
  .badge {
    grid-row: span 2; align-self: center;
    font: 700 .66rem/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    text-transform: uppercase; letter-spacing: .12em;
    padding: .35rem .55rem; border-radius: .25rem;
    white-space: nowrap;
  }
  .badge.intern { color: var(--badge-intern); background: var(--badge-intern-bg); }
  .badge.newgrad { color: var(--badge-grad); background: var(--badge-grad-bg); }
  .new-flag {
    font: 800 .62rem/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: .14em;
    color: var(--wire-red);
    background: var(--wire-red-soft);
    padding: .25rem .45rem; border-radius: .2rem;
  }
  .empty {
    padding: 3.5rem 0; text-align: center;
    color: var(--ink-soft); font-style: italic;
  }
  @media (max-width: 640px) {
    .row { grid-template-columns: 1fr auto; }
    .when { grid-row: auto; grid-column: 1 / -1; }
    .sub { grid-column: 1; }
  }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <div class="masthead">
      <h1>Product&nbsp;Wire<span class="dot">.</span></h1>
      <span class="tagline">PM · Product Engineer · TPM — New Grad &amp; Internships</span>
    </div>
    <div class="meta" id="meta">loading…</div>
  </header>

  <div class="controls">
    <button class="chip" data-kind="all" aria-pressed="true">All</button>
    <button class="chip" data-kind="newgrad" aria-pressed="false">New Grad</button>
    <button class="chip" data-kind="intern" aria-pressed="false">Intern</button>
    <input id="q" type="search" placeholder="search company, title, location…" autocomplete="off">
  </div>

  <ol id="feed"></ol>
  <p class="empty" id="empty" hidden>nothing on the wire matches.</p>
</div>

<script>
(async () => {
  const feed = document.getElementById("feed");
  const meta = document.getElementById("meta");
  const empty = document.getElementById("empty");
  const q = document.getElementById("q");
  let kind = "all", jobs = [];

  const fmtAgo = (iso) => {
    const days = Math.floor((Date.now() - Date.parse(iso)) / 86400000);
    if (days <= 0) return "today";
    if (days === 1) return "1 day";
    if (days < 30) return days + " days";
    const m = Math.floor(days / 30);
    return m + " mo" + (m > 1 ? "s" : "");
  };
  const isFresh = (iso) => Date.now() - Date.parse(iso) < 48 * 3600000;
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const render = () => {
    const needle = q.value.trim().toLowerCase();
    const shown = jobs.filter((j) =>
      (kind === "all" || j.kind === kind) &&
      (!needle || `${j.company} ${j.title} ${j.location}`.toLowerCase().includes(needle))
    );
    empty.hidden = shown.length > 0;
    feed.innerHTML = shown.map((j, i) => `
      <li>
        <a class="row ${isFresh(j.firstSeen) ? "fresh" : ""}" href="${esc(j.url || "#")}"
           target="_blank" rel="noopener" style="animation-delay:${Math.min(i * 14, 350)}ms">
          <span class="when">${fmtAgo(j.firstSeen)}</span>
          <span class="head">
            <span class="co">${esc(j.company)}</span>
            <span class="title">${esc(j.title)}</span>
            ${isFresh(j.firstSeen) ? '<span class="new-flag">NEW</span>' : ""}
          </span>
          <span class="sub">${esc(j.location || "location unlisted")} · via ${esc(j.source)}</span>
          <span class="badge ${j.kind}">${j.kind === "intern" ? "Intern" : "New Grad"}</span>
        </a>
      </li>`).join("");
  };

  document.querySelectorAll(".chip").forEach((b) =>
    b.addEventListener("click", () => {
      kind = b.dataset.kind;
      document.querySelectorAll(".chip").forEach((x) =>
        x.setAttribute("aria-pressed", String(x === b)));
      render();
    })
  );
  q.addEventListener("input", render);

  try {
    const d = await fetch("./data.json", { cache: "no-store" }).then((r) => r.json());
    jobs = d.jobs || [];
    const fresh = jobs.filter((j) => isFresh(j.firstSeen)).length;
    meta.innerHTML =
      `<span><b>${jobs.length}</b> open roles</span>` +
      `<span><b>${fresh}</b> new in 48h</span>` +
      `<span><b>${d.companiesTracked}</b> boards watched</span>` +
      `<span>updated <b>${new Date(d.generatedAt).toLocaleString()}</b></span>` +
      (d.failures?.length ? `<span class="warn">${d.failures.length} source error(s)</span>` : "");
    render();
  } catch {
    meta.textContent = "could not load data.json — has the first tracker run committed it?";
  }
})();
</script>
</body>
</html>
